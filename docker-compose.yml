version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lorefit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lorefit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lorefit-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lorefit-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lorefit
      PORT: 5001
      JWT_SECRET: your-secret-key-change-in-production
      ADMIN_EMAILS: admin@example.com
      NODE_ENV: development
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run migrate && npm run server"
    networks:
      - lorefit-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lorefit-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - lorefit-network

volumes:
  postgres_data:

networks:
  lorefit-network:
    driver: bridge
