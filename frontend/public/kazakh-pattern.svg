<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- Main diamond -->
  <polygon points="80,18 122,80 80,142 38,80" fill="none" stroke="#0f4f8c" stroke-width="1.8"/>
  <!-- Inner diamond -->
  <polygon points="80,36 104,80 80,124 56,80" fill="none" stroke="#0f4f8c" stroke-width="1.1"/>

  <!-- Ram horns top (қошқар мүйіз) -->
  <path d="M74,18 C68,10 58,12 56,5 C54,0 60,-2 65,3" fill="none" stroke="#0f4f8c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M86,18 C92,10 102,12 104,5 C106,0 100,-2 95,3" fill="none" stroke="#0f4f8c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ram horns bottom -->
  <path d="M74,142 C68,150 58,148 56,155 C54,160 60,162 65,157" fill="none" stroke="#0f4f8c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M86,142 C92,150 102,148 104,155 C106,160 100,162 95,157" fill="none" stroke="#0f4f8c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ram horns left -->
  <path d="M38,74 C30,68 32,58 25,56 C20,54 18,60 23,65" fill="none" stroke="#0f4f8c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M38,86 C30,92 32,102 25,104 C20,106 18,100 23,95" fill="none" stroke="#0f4f8c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Ram horns right -->
  <path d="M122,74 C130,68 128,58 135,56 C140,54 142,60 137,65" fill="none" stroke="#0f4f8c" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M122,86 C130,92 128,102 135,104 C140,106 142,100 137,95" fill="none" stroke="#0f4f8c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center diamond -->
  <polygon points="80,72 88,80 80,88 72,80" fill="#0f4f8c"/>

  <!-- Corner tile diamonds (for seamless repeat) -->
  <polygon points="80,0 85,5 80,10 75,5"   fill="#0f4f8c"/>
  <polygon points="80,150 85,155 80,160 75,155" fill="#0f4f8c"/>
  <polygon points="0,80 5,75 10,80 5,85"   fill="#0f4f8c"/>
  <polygon points="150,80 155,75 160,80 155,85" fill="#0f4f8c"/>

  <!-- Connecting lines from diamond tips to tile edges -->
  <line x1="80" y1="0"   x2="80" y2="18"  stroke="#0f4f8c" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="80" y1="142" x2="80" y2="160" stroke="#0f4f8c" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="0"  y1="80"  x2="38" y2="80"  stroke="#0f4f8c" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="122" y1="80" x2="160" y2="80" stroke="#0f4f8c" stroke-width="1" stroke-dasharray="2,3"/>
</svg>
